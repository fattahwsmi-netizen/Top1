
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top 1 Salon</title>
<style>
  :root {
    --bg-color: #0d0d0d;
    --card-bg: #1a1a1a;
    --text-primary: #ffffff;
    --text-secondary: #a6a6a6;
    --accent-color: #e6e6e6;
    --border-color: #333333;
  }
  
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-primary);
    margin: 0;
    padding: 20px;
  }
  
  .header {
    text-align: center;
    padding: 40px 0;
    border-bottom: 1px solid var(--border-color);
  }
  
  .logo {
    font-size: 3rem;
    font-weight: bold;
    letter-spacing: 2px;
    text-transform: uppercase;
    background: linear-gradient(45deg, #ffffff, #8c8c8c);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  
  .section-title {
    font-size: 1.8rem;
    margin: 40px 0 20px;
    border-right: 4px solid var(--text-primary);
    padding-right: 15px;
  }
  
  .barbers-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
  }
  
  .barber-card {
    background-color: var(--card-bg);
    border-radius: 12px;
    padding: 20px;
    border: 1px solid var(--border-color);
    transition: transform 0.3s ease, border-color 0.3s ease;
  }
  
  .barber-card:hover {
    transform: translateY(-5px);
    border-color: var(--text-primary);
  }
  
  .barber-name {
    font-size: 1.4rem;
    font-weight: 600;
    margin-bottom: 10px;
  }
  
  .skills-tag {
    display: inline-block;
    background-color: #262626;
    color: var(--text-secondary);
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 0.9rem;
    margin-bottom: 15px;
  }
  
  .rating {
    color: #ffd700;
    margin-bottom: 15px;
  }
  
  .book-btn {
    display: block;
    width: 100%;
    background-color: var(--text-primary);
    color: var(--bg-color);
    text-align: center;
    padding: 12px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
    transition: background-color 0.3s ease;
  }
  
  .book-btn:hover {
    background-color: var(--text-secondary);
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">Top 1</div>
  <p>صالون الحلاقة العصرية</p>
</div>

<div class="section-title">فريق العمل</div>

<div class="barbers-grid">
  <div class="barber-card">
    <div class="barber-name">يوسف</div>
    <div class="skills-tag">تدريج كلاسيكي & تحديد لحية</div>
    <div class="rating">★★★★★</div>
    <a href="#" class="book-btn">حجز موعد</a>
  </div>

  <div class="barber-card">
    <div class="barber-name">أحمد</div>
    <div class="skills-tag">قصات عصرية & صبغات</div>
    <div class="rating">★★★★☆</div>
    <a href="#" class="book-btn">حجز موعد</a>
  </div>

  <div class="barber-card">
    <div class="barber-name">عبده</div>
    <div class="skills-tag">حلاقة أطفال & سشوار</div>
    <div class="rating">★★★★★</div>
    <a href="#" class="book-btn">حجز موعد</a>
  </div>

  <div class="barber-card">
    <div class="barber-name">منعم</div>
    <div class="skills-tag">تنظيف بشرة & ماسكات</div>
    <div class="rating">★★★★☆</div>
    <a href="#" class="book-btn">حجز موعد</a>
  </div>

  <div class="barber-card">
    <div class="barber-name">آدم</div>
    <div class="skills-tag">تنعيم شعر & عناية شاملة</div>
    <div class="rating">★★★★★</div>
    <a href="#" class="book-btn">حجز موعد</a>
  </div>
</div>

</body>
</html>
